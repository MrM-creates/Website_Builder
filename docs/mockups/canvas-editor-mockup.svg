  <text x="1298" y="220" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Layout: 1/2 + 1/2</text>
  <text x="1298" y="242" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Abstand oben/unten</text>
  <text x="1298" y="264" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Hintergrund: Standard</text>
  <text x="1298" y="286" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Sichtbarkeit: Desktop/Tablet/Mobile</text>

  <rect x="1282" y="330" width="278" height="210" rx="10" fill="#131822" stroke="#2A2F3A"/>
  <text x="1298" y="359" fill="#E0E7F2" font-family="Inter, sans-serif" font-size="15" font-weight="600">Seiten-SEO</text>
  <text x="1298" y="386" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Meta Title</text>
  <text x="1298" y="410" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Meta Description</text>
  <text x="1298" y="434" fill="#9FB0C7" font-family="Inter, sans-serif" font-size="13">Open Graph Bild</text>
  <text x="1298" y="470" fill="#7F8FA5" font-family="Inter, sans-serif" font-size="12">→ schreibt in Kirby page fields</text>

  <rect x="1282" y="556" width="278" height="190" rx="10" fill="#131822" stroke="#2A2F3A"/>
  <text x="1298" y="585" fill="#E0E7F2" font-family="Inter, sans-serif" font-size="15" font-weight="600">Sync Status</text>
