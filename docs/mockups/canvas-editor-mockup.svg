  <text x="1320" y="617" fill="#BFD1B0" font-family="Inter, sans-serif" font-size="13">Kirby verbunden</text>
  <circle cx="1306" cy="638" r="6" fill="#8CC63F"/>
  <text x="1320" y="643" fill="#BFD1B0" font-family="Inter, sans-serif" font-size="13">Autosave aktiv</text>
  <circle cx="1306" cy="664" r="6" fill="#8CC63F"/>
  <text x="1320" y="669" fill="#BFD1B0" font-family="Inter, sans-serif" font-size="13">Preview aktuell</text>

  <text x="42" y="944" fill="#6F7D92" font-family="Inter, sans-serif" font-size="13">Konzept: Canvas UI steuert Kirby-Felder/Layouts im Hintergrund (kein CMS-Wissen nötig).</text>
</svg>
