  <rect x="460" y="590" width="640" height="140" rx="12" fill="#FFFFFF" stroke="#D9DEE8"/>
  <text x="488" y="637" fill="#1C2430" font-family="Inter, sans-serif" font-size="24" font-weight="700">Kontakt</text>
  <text x="488" y="669" fill="#5B667A" font-family="Inter, sans-serif" font-size="16">mail@example.com · instagram.com/deinprofil</text>

