  <text x="488" y="798" fill="#C7D0DE" font-family="Inter, sans-serif" font-size="14">© 2026 MrM</text>
  <text x="488" y="824" fill="#8FA1BB" font-family="Inter, sans-serif" font-size="14">Designed with the power of AI</text>

