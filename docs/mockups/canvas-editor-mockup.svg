  <text x="250" y="64" fill="#8F99A8" font-family="Inter, sans-serif" font-size="20">Canvas Editor (Kirby-backed)</text>

  <rect x="1160" y="36" width="130" height="42" rx="10" fill="#1A1E27" stroke="#394150"/>
