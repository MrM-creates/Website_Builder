  <text x="56" y="416" fill="#9EABBF" font-family="Inter, sans-serif" font-size="14">Text  Bild  Galerie</text>
  <text x="56" y="440" fill="#9EABBF" font-family="Inter, sans-serif" font-size="14">Video  Kontakt  Button</text>
