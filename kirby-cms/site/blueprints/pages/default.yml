title: Default Page
num: default
create:
  status: listed

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          layout:
            label: Seitenlayout
            type: layout
            layouts:
              - "1/1"
              - "1/2, 1/2"
              - "1/3, 2/3"
              - "2/3, 1/3"
              - "1/3, 1/3, 1/3"
              - "1/4, 1/4, 1/4, 1/4"
              - "1/4, 3/4"
              - "3/4, 1/4"
            fieldsets:
              text:
                type: group
                label: Text
                fieldsets:
                  - heading
                  - text
                  - list
                  - quote
                  - line
                  - markdown
                  - code
              media:
                type: group
                label: Medien
                fieldsets:
                  - image
                  - gallery
                  - video
              flatsite:
                type: group
                label: Flatsite
                fieldsets:
                  - button
                  - contactform
  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        templates:
          - default
          - home
          - about
          - contact
        sortable: true
      files:
        type: files
