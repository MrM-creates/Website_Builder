title: Default Page

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          layout:
            label: Seitenlayout
            type: layout
            layouts:
              - "1/1"
              - "1/2, 1/2"
              - "1/3, 2/3"
              - "2/3, 1/3"
              - "1/3, 1/3, 1/3"
              - "1/4, 1/4, 1/4, 1/4"
              - "1/4, 3/4"
              - "3/4, 1/4"
            # No fieldset restriction here:
            # Kirby then shows all available core + custom blocks
            # (the "extended" editor behavior you described).
  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        templates:
          - default
          - home
          - about
          - contact
        sortable: true
      files:
        type: files
