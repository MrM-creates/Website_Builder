title: Default Page
num: default
create:
  status: listed

columns:
  main:
    width: 1/1
    sections:
      content:
        type: fields
        fields:
          layout:
            label: Seitenlayout
            type: layout
            layouts:
              - "1/1"
              - "1/2, 1/2"
              - "1/3, 2/3"
              - "2/3, 1/3"
              - "1/3, 1/3, 1/3"
              - "1/4, 1/4, 1/4, 1/4"
              - "1/4, 3/4"
              - "3/4, 1/4"
            fieldsets:
              text:
                type: group
                label: Text
                fieldsets:
                  - heading
                  - text
                  - list
                  - quote
                  - line
                  - markdown
                  - code
              media:
                type: group
                label: Medien
                fieldsets:
                  - image
                  - gallery
                  - video
              flatsite:
                type: group
                label: Flider
                fieldsets:
                  - button
                  - contactform
          seodesc:
            label: Google Beschreibung (Meta Description)
            type: textarea
            size: small
            buttons: false
            maxlength: 160
            placeholder: Kurze Zusammenfassung der Seite fuer Suchmaschinen (max. 160 Zeichen)
            help: Dieser Text ist nicht auf deiner Website sichtbar. Er erscheint nur in Suchmaschinen unter dem Seitentitel. Mit "Vorschlag generieren" erstellt Flider einen Vorschlag aus dem Seiteninhalt (nur wenn genug Inhalt vorhanden ist).
